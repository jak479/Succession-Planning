# Live evaluation of the front door (build item 2) against Claude.
# Runs only when started by hand (Actions tab → front-door-eval → Run workflow).
# Authenticates with Workload Identity Federation: GitHub issues a short-lived identity token, Anthropic
# exchanges it for a short-lived access token. No API key is stored anywhere. Uses only the fictional sample client.
name: front-door-eval
on: workflow_dispatch
permissions:
  id-token: write   # lets this job request a GitHub identity token
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres@localhost:5432
      DATABASE_URL: postgresql://postgres@localhost:5432/oew_dev
      # Federation ids from the Claude Console (Workload identity page). Identifiers, not secrets.
      ANTHROPIC_ORGANIZATION_ID: cd7121a4-669b-4dda-a1de-ad2f59a785bb
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01SRfCzKt6Z2WR4S8LYYAsvM
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01UK65FPhpAykYkcP9tBzQoF
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: core
      - run: npm ci
        working-directory: server
      - name: Unit and database tests
        run: (cd core && npm test) && (cd server && npm test)
      - name: Build sample database
        working-directory: server
        run: |
          npm run -s dev-db > ids.txt
          node -e 'const s=require("fs").readFileSync("ids.txt","utf8"); const j=JSON.parse(s.slice(0, s.indexOf("}")+1));
            console.log("ENGINE_PERSON_ID="+j.engine); console.log("CLIENT_PERSON_ID="+j.dana); console.log("WORKSPACE_ID="+j.entity);' >> "$GITHUB_ENV"
      - name: Live eval (12 cases)
        working-directory: server
        # GitHub identity tokens last about 5 minutes and Anthropic accepts each one once, so a fresh token is
        # written to the file every 2 minutes; the SDK re-reads the file whenever it renews its access token.
        run: |
          fetch() { curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
            && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"; }
          fetch
          ( while sleep 120; do fetch; done ) &
          npm run eval
